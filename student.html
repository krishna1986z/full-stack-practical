<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .result {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: lightblue;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 10px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

<div class="result">

    <h2>Student Result</h2>

    <label>Student Name:</label>
    <input type="text" id="name">

    <label>Java Marks:</label>
    <input type="number" id="java">

    <label>DBMS Marks:</label>
    <input type="number" id="dbms">

    <label>DSA Marks:</label>
    <input type="number" id="dsa">

    <button onclick="calculateResult()">Calculate Result</button>

    <div id="output"></div>

</div>


<script>

function calculateResult() {

    var name = document.getElementById("name").value;

    var java = Number(document.getElementById("java").value);
    var dbms = Number(document.getElementById("dbms").value);
    var dsa = Number(document.getElementById("dsa").value);

    var total = java + dbms + dsa;

    var percentage = total / 3;

    var result;

    if (java >= 35 && dbms >= 35 && dsa >= 35) {
        result = "PASS";
    }
    else {
        result = "FAIL";
    }

    document.getElementById("output").innerHTML =
        "<h3>Result</h3>" +
        "Student Name: " + name + "<br>" +
        "Java: " + java + "<br>" +
        "DBMS: " + dbms + "<br>" +
        "DSA: " + dsa + "<br>" +
        "Total: " + total + " / 300<br>" +
        "Percentage: " + percentage.toFixed(2) + "%<br>" +
        "<b>Result: " + result + "</b>";
}

</script>

</body>
</html>
